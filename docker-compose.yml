services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yachdahv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - yachdahv_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yachdahv"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yachdahv_postgres:
